name: Build MUSEA Android packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'delete-account.html'
      - 'community-guidelines.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-package.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required MUSEA assets
        run: |
          node --input-type=module <<'NODE'
          import { access } from 'node:fs/promises';
          const files = ['index.html','privacy.html','delete-account.html','community-guidelines.html','manifest.webmanifest','sw.js','icon-192.png','icon-512.png'];
          for (const file of files) await access(file);
          console.log('All required web assets are present.');
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web assets and sync Capacitor
        run: npm run android:prepare

      - name: Configure release signing when upload-key secrets are available
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          source = path.read_text()
          if "signingConfigs" not in source:
              signing_block = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
              source, count = re.subn(r"(?m)^    buildTypes\s*\{", lambda m: signing_block + m.group(0), source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely locate buildTypes; refusing to modify Gradle.")

          if "signingConfig signingConfigs.release" not in source:
              source, count = re.subn(r"(release\s*\{)", lambda m: m.group(1) + "\n            signingConfig signingConfigs.release", source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely locate the release build type.")

          path.write_text(source)
          print("Release signing configuration prepared.")
          PY

      - name: Build Android APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Remove temporary upload key
        if: always()
        run: rm -f android/app/upload-key.jks

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musea-android-build
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
