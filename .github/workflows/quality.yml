name: MUSEA quality checks

on:
  push:
    branches:
      - main
      - final/musea-v3-product-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Front-end syntax and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-inline-js.mjs

  edge-functions:
    name: Supabase Edge Function type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/musea-ai/index.ts
      - run: deno check supabase/functions/create-signature-checkout/index.ts
      - run: deno check supabase/functions/create-billing-portal/index.ts
      - run: deno check supabase/functions/stripe-webhook/index.ts
