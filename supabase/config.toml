# MUSEA — Edge Functions
# Checkout et portail : JWT Supabase obligatoire.
# Webhook externe : JWT Supabase désactivé, signature Stripe vérifiée dans le code.
[functions.stripe-webhook]
verify_jwt = false

[functions.musea-ai]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-billing-portal]
verify_jwt = true
